name: Tag released images

on:
  release:
    types: [published]

jobs:

  # Export the locks from env-assets       
  export-locks:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: write  # to upload locks
      packages: read
      pages: write
      id-token: write

    steps:

      - name: Check the release is from main
        run: |
          if [ "${{ github.event.release.target_commitish }}" != "main" ]; then
            echo "❌ Releases must be created from main branch."
            echo "    Current ref: ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Branch check passed."

      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clean_storage: false
      
      - name: Export the locks
        run: |
          python scripts/build.py --debug \
              --repo "ghcr.io/${{ github.repository }}" \
              --tag 26.0731 \
              --export-locks \
              "env-assets"
          
          # add .txt for build-* and toml files
          find locks -type f \( -name "build-*" -o -name "*.toml" \) -exec mv {} {}.txt \;
          
          # generate a lock index
          python scripts/locks-index.py ${{ github.ref_name }}

          # put all published content to public/
          mkdir -p public/${{ github.ref_name }}
          cp -r locks/* public/${{ github.ref_name }}

          # pack lock files into a zip file
          if [ -d locks ]; then
            zip -r "environment-locks.zip" "locks"
          fi
      
      # Publish to gh pages
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      
      - name: Patch Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.ref_name }}/"
          
          # Fetch the current release notes and save to a temporary file
          gh release view ${{ github.ref_name }} --json body --jq '.body' > release_notes.md

          # Append the Pages link to the lock page
          echo "" >> release_notes.md
          echo "### Installed Environments" >> release_notes.md
          echo "[Browse the lock files for the installed environments]($PAGES_URL)" >> release_notes.md

          # Update the release with the newly modified file
          gh release edit ${{ github.ref_name }} --notes-file release_notes.md
  
  tag-images-for-release:
    needs: export-locks
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'

    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Tag main images with release tags
        run: |
          ENDPOINT="--ecr ${{ secrets.ECR_ENDPOINT }} --ecr ${{ secrets.ECR_ENDPOINT_PROD }}"
          
          # Note that all images are tagged for release
          python scripts/build.py --debug \
              --repo "ghcr.io/${{ github.repository }}" \
              --tag 26.0731 \
              --retag main stable "${{ github.event.release.tag_name }}" \
              $ENDPOINT

  tag-ami-for-release:
    needs: tag-images-for-release
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Steup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clean_storage: false
          registry_login: false
      
      - name: python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Trigger ami release
        run: |            
          echo "++++ Copy develop AMI to stable ++++ "
          ENDPOINT="${{ secrets.AMI_ENDPOINT }} ${{ secrets.AMI_ENDPOINT_PROD }}"
          python scripts/ami-builder.py --src 26.0731 --ssm-path stable \
              --endpoint $ENDPOINT
          
          RELEASE="${{ github.event.release.tag_name }}"
          echo "++++ Copy develop AMI to release: $RELEASE ++++ "
          python scripts/ami-builder.py --src 26.0731 --ssm-path $RELEASE \
              --endpoint $ENDPOINT