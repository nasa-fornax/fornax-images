name: Create Release and Tag Images
run-name: "Release: ${{ inputs.source_tag }} -> ${{ inputs.release_version }}"

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source image tag to use for this release'
        required: true
        default: 'develop'
      release_version:
        description: 'New release version (e.g., v1.2.0)'
        required: true

jobs:

  # 1. First, create the actual GitHub Release
  create-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and git tag
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Release Notes for Tag
        id: extract_notes
        run: |
          VERSION="${{ inputs.release_version }}"
          echo "Extracting notes for version: $VERSION"
          
          # Use awk to find the heading (e.g., "## 26.0908") and print everything
          # until it hits the next "## " heading or the end of the file.
          awk -v tag="## $VERSION" '
            index($0, tag) == 1 {flag=1; next}  # When we find the heading, set flag to 1 and skip printing the heading itself
            /^## / {if(flag) exit}              # If flag is 1 and we hit the *next* heading, stop
            flag {print}                        # If flag is 1, print the line
          ' changes.md > extracted_notes.md
          
          # Fail if no release notes was available in changes.md
          if [ ! -s extracted_notes.md ]; then
            echo "⚠️ No specific release notes found for $VERSION in changes.md."
            exit 1
          fi
          
          # Print the extracted notes to the Action log for debugging
          echo "=== Extracted Notes ==="
          cat extracted_notes.md
          echo "======================="

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ inputs.release_version }} \
            --target main \
            --title "${{ inputs.release_version }}" \
            --notes-file extracted_notes.md

  # Export the locks from env-assets       
  export-locks:
    needs: create-github-release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # to push to gh-pages branch
      packages: read
      pages: write
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clean_storage: false
      
      - name: Export the locks
        run: |
          python scripts/build.py --debug \
              --repo "ghcr.io/${{ github.repository }}" \
              --tag ${{ inputs.source_tag }} \
              --export-locks \
              "env-assets"
          
          # add .txt for build-* and toml files
          find locks -type f \( -name "build-*" -o -name "*.toml" \) -exec mv {} {}.txt \;
          
          # generate a lock index
          python scripts/locks-index.py "${{ inputs.release_version }}"

          # put all published content to public/
          mkdir -p public/"${{ inputs.release_version }}"
          cp -r locks/* public/"${{ inputs.release_version }}"/

          # pack lock files into a zip file
          if [ -d locks ]; then
            zip -r "environment-locks.zip" "locks"
          fi
      
      # Publish to gh pages using a branch to preserve old releases
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true # Prevents overwriting older releases
      
      - name: Update Release Notes with Lock Link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.release_version }}/"
          
          # Fetch the current release notes and save to a temporary file
          gh release view ${{ inputs.release_version }} --json body --jq '.body' > release_notes.md

          # Append the Pages link to the lock page
          echo "" >> release_notes.md
          echo "### Installed Environments" >> release_notes.md
          echo "[Browse the lock files for the installed environments]($PAGES_URL)" >> release_notes.md

          # Update the release with the newly modified file
          gh release edit ${{ inputs.release_version }} --notes-file release_notes.md
          
          # Upload the locks zip as a release asset!
          if [ -f "environment-locks.zip" ]; then
            gh release upload ${{ inputs.release_version }} environment-locks.zip --clobber
          fi
  
  tag-images-for-release:
    needs: export-locks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Tag main images with release tags
        run: |
          ENDPOINT="--ecr ${{ secrets.ECR_ENDPOINT }} --ecr ${{ secrets.ECR_ENDPOINT_PROD }}"
          
          # Note that all images are tagged for release
          python scripts/build.py --debug \
              --repo "ghcr.io/${{ github.repository }}" \
              --tag ${{ inputs.source_tag }} \
              --retag main stable "${{ inputs.release_version }}" \
              $ENDPOINT

  tag-ami-for-release:
    needs: tag-images-for-release
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clean_storage: false
          registry_login: false
      
      - name: python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Trigger ami release
        run: |            
          echo "++++ Copy ${{ inputs.source_tag }} AMI to stable ++++ "
          ENDPOINT="${{ secrets.AMI_ENDPOINT }} ${{ secrets.AMI_ENDPOINT_PROD }}"
          python scripts/ami-builder.py --src ${{ inputs.source_tag }} --ssm-path stable \
              --endpoint $ENDPOINT
          
          RELEASE="${{ inputs.release_version }}"
          echo "++++ Copy ${{ inputs.source_tag }} AMI to release: $RELEASE ++++ "
          python scripts/ami-builder.py --src ${{ inputs.source_tag }} --ssm-path $RELEASE \
              --endpoint $ENDPOINT