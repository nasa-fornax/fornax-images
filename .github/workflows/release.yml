name: Tag released images

on:
  release:
    types: [published]

jobs:

  # Export the locks from env-assets       
  export-locks:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: write  # to upload locks
      packages: read
      pages: write
      id-token: write

    steps:

      - name: Check the release is from main
        run: |
          if [ "${{ github.event.release.target_commitish }}" != "main" ]; then
            echo "❌ Releases must be created from main branch."
            echo "    Current ref: ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Branch check passed."

      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clean_storage: false
      
      - name: Export the locks
        run: |
          python scripts/build.py --debug \
              --repo "ghcr.io/${{ github.repository }}" \
              --tag develop \
              --export-locks \
              "env-assets"
          
          # generate a lock index
          python scripts/locks-index.py

          # put all published content to public/
          mkdir -p public/${{ github.ref_name }}
          cp -r locks index.md public/${{ github.ref_name }}

          # pack lock files into a zip file
          if [ -d locks ]; then
            zip -r "environment-locks.zip" "locks" index.md
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: environment-locks
          path: ./environment-locks.zip
      
      - name: Upload lock files to the release
        uses: softprops/action-gh-release@v3
        with:
          files: ./environment-locks.zip
      
      # Publish to gh pages      
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  
  tag-images-for-release:
    needs: export-locks
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'

    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Tag main images with release tags
        run: |
          ENDPOINT="--ecr ${{ secrets.ECR_ENDPOINT }} --ecr ${{ secrets.ECR_ENDPOINT_PROD }}"
          
          # Note that all images are tagged for release
          python scripts/build.py --debug \
              --repo "ghcr.io/${{ github.repository }}" \
              --tag develop \
              --retag main stable "${{ github.event.release.tag_name }}" \
              $ENDPOINT

  tag-ami-for-release:
    needs: tag-images-for-release
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Steup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clean_storage: false
          registry_login: false
      
      - name: python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Trigger ami release
        run: |            
          echo "++++ Copy develop AMI to stable ++++ "
          ENDPOINT="${{ secrets.AMI_ENDPOINT }} ${{ secrets.AMI_ENDPOINT_PROD }}"
          python scripts/ami-builder.py --src develop --ssm-path stable \
              --endpoint $ENDPOINT
          
          RELEASE="${{ github.event.release.tag_name }}"
          echo "++++ Copy develop AMI to release: $RELEASE ++++ "
          python scripts/ami-builder.py --src develop --ssm-path $RELEASE \
              --endpoint $ENDPOINT